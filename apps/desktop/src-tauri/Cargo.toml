[package]
name = "athria"
version = "0.2.0"
description = "Athria local-first training infrastructure"
authors = ["Athria contributors"]
edition = "2024"

[lib]
name = "athria_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
athria-application = { path = "../../../crates/athria-application" }
athria-core = { path = "../../../crates/athria-core" }
athria-mcp = { path = "../../../crates/athria-mcp" }
athria-store = { path = "../../../crates/athria-store" }
athria-runtime = { path = "../../../crates/athria-runtime" }
athria-vault = { path = "../../../crates/athria-vault" }
athria-integrations = { path = "../../../crates/athria-integrations" }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
toml_edit = "0.23"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent"] }
