[package]
name = "athria-mcp"
version.workspace = true
edition.workspace = true

[features]
conformance = []

[[example]]
name = "conformance_server"
required-features = ["conformance"]

[dependencies]
athria-application = { workspace = true }
athria-core = { workspace = true }
athria-skills = { workspace = true }
athria-store = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.56", default-features = false }
rmcp = { version = "3.4", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["io-std", "macros", "net", "rt-multi-thread"] }
axum = "0.8"
